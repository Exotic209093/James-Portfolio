<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1e0a2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#7c3aed" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#000"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="none" stroke="url(#stroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- envelope -->
    <g transform="translate(280 240)" stroke-width="6">
      <rect x="0" y="0" width="280" height="180" rx="10" fill="#000"/>
      <polyline points="0,0 140,110 280,0"/>
    </g>
    <!-- branching arrows -->
    <g transform="translate(580 330)" stroke-width="6">
      <path d="M 0 0 L 80 0"/>
      <path d="M 80 0 L 180 -90"/>
      <path d="M 80 0 L 180 0"/>
      <path d="M 80 0 L 180 90"/>
      <polyline points="160,-104 180,-90 158,-78"/>
      <polyline points="158,-14 180,0 158,14"/>
      <polyline points="158,76 180,90 160,104"/>
      <!-- destination tags -->
      <rect x="190" y="-115" width="120" height="50" rx="8" stroke-width="5"/>
      <rect x="190" y="-25" width="120" height="50" rx="8" stroke-width="5"/>
      <rect x="190" y="65" width="120" height="50" rx="8" stroke-width="5"/>
      <!-- urgency dots -->
      <circle cx="220" cy="-90" r="8" fill="#dc2626" stroke="none"/>
      <circle cx="220" cy="0" r="8" fill="#facc15" stroke="none"/>
      <circle cx="220" cy="90" r="8" fill="#22c55e" stroke="none"/>
      <line x1="240" y1="-90" x2="296" y2="-90" stroke-width="4"/>
      <line x1="240" y1="0" x2="296" y2="0" stroke-width="4"/>
      <line x1="240" y1="90" x2="296" y2="90" stroke-width="4"/>
    </g>
    <!-- AI sparkle -->
    <g transform="translate(420 200)" fill="url(#stroke)" stroke="none">
      <path d="M 0 -28 L 6 -6 L 28 0 L 6 6 L 0 28 L -6 6 L -28 0 L -6 -6 Z"/>
    </g>
    <g transform="translate(500 160)" fill="url(#stroke)" stroke="none" opacity="0.7">
      <path d="M 0 -16 L 4 -4 L 16 0 L 4 4 L 0 16 L -4 4 L -16 0 L -4 -4 Z"/>
    </g>
  </g>
  <text x="60" y="615" fill="#e9d5ff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">AI Email Triage Automation</text>
  <text x="60" y="648" fill="#a78bfa" fill-opacity="0.65" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="2">N8N · NODE · LLM WORKFLOW</text>
</svg>
