<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1e0a2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#7c3aed" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#000"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Terminal window -->
  <g transform="translate(90 90)">
    <rect x="0" y="0" width="700" height="430" rx="14" fill="#0d0815" stroke="url(#stroke)" stroke-width="2" stroke-opacity="0.5"/>
    <!-- title bar -->
    <rect x="0" y="0" width="700" height="38" rx="14" fill="#1a0f2e"/>
    <rect x="0" y="24" width="700" height="14" fill="#1a0f2e"/>
    <circle cx="24" cy="19" r="6" fill="#f87171"/>
    <circle cx="46" cy="19" r="6" fill="#fbbf24"/>
    <circle cx="68" cy="19" r="6" fill="#34d399"/>
    <text x="350" y="24" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" letter-spacing="1">flux — claude code session</text>
    <!-- terminal body -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
      <text x="22" y="78" fill="#34d399">➜</text>
      <text x="44" y="78" fill="#e9d5ff">claude</text>
      <text x="22" y="106" fill="#a78bfa">● Resuming session</text>
      <text x="22" y="134" fill="#c4b5fd" fill-opacity="0.8">  Reading lib/projects.ts</text>
      <text x="22" y="162" fill="#c4b5fd" fill-opacity="0.8">  Editing components/sections/Hero.tsx</text>
      <text x="22" y="190" fill="#34d399">✓ Build passed · 32 pages</text>
      <text x="22" y="226" fill="#34d399">➜</text>
      <text x="44" y="226" fill="#e9d5ff">git push -u origin main</text>
      <text x="22" y="254" fill="#f0abfc">▸ replaying ████████████░░░░  72%</text>
      <rect x="22" y="276" width="9" height="20" fill="#e9d5ff">
      </rect>
    </g>
  </g>

  <!-- Metrics panel -->
  <g transform="translate(830 110)">
    <rect x="0" y="0" width="280" height="390" rx="12" fill="#0f0a1a" stroke="url(#stroke)" stroke-width="2" stroke-opacity="0.4"/>
    <text x="20" y="36" fill="#e9d5ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2">SESSION METRICS</text>

    <text x="20" y="76" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Tokens</text>
    <text x="260" y="76" text-anchor="end" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700">1.24M</text>
    <text x="20" y="106" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Cost</text>
    <text x="260" y="106" text-anchor="end" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700">$3.18</text>
    <text x="20" y="136" fill="#a78bfa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Tool calls</text>
    <text x="260" y="136" text-anchor="end" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="13" font-weight="700">147</text>

    <!-- activity bars -->
    <text x="20" y="186" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ACTIVITY</text>
    <g>
      <rect x="20" y="210" width="20" height="90" rx="3" fill="url(#bar)" opacity="0.5"/>
      <rect x="50" y="240" width="20" height="60" rx="3" fill="url(#bar)" opacity="0.6"/>
      <rect x="80" y="196" width="20" height="104" rx="3" fill="url(#bar)"/>
      <rect x="110" y="230" width="20" height="70" rx="3" fill="url(#bar)" opacity="0.7"/>
      <rect x="140" y="252" width="20" height="48" rx="3" fill="url(#bar)" opacity="0.5"/>
      <rect x="170" y="214" width="20" height="86" rx="3" fill="url(#bar)" opacity="0.8"/>
      <rect x="200" y="236" width="20" height="64" rx="3" fill="url(#bar)" opacity="0.6"/>
      <rect x="230" y="222" width="20" height="78" rx="3" fill="url(#bar)" opacity="0.7"/>
    </g>

    <!-- plan limit gauge -->
    <text x="20" y="346" fill="#c4b5fd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PLAN LIMIT</text>
    <rect x="20" y="356" width="240" height="12" rx="6" fill="#1e0a2e"/>
    <rect x="20" y="356" width="156" height="12" rx="6" fill="url(#stroke)"/>
  </g>

  <text x="90" y="592" fill="#e9d5ff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">Flux Terminal</text>
  <text x="90" y="625" fill="#a78bfa" fill-opacity="0.65" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="2">CLAUDE CODE · ELECTRON TERMINAL · SESSION REPLAY</text>
</svg>
