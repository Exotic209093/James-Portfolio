<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7e22ce" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1e0a2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="chipFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e0a2e" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#7c3aed" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#000"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(600 290)" fill="none" stroke="url(#stroke)" stroke-linecap="round" stroke-linejoin="round">
    <!-- chip pins (top, bottom, left, right) -->
    <g stroke-width="5">
      <line x1="-140" y1="-200" x2="-140" y2="-160"/>
      <line x1="-90" y1="-200" x2="-90" y2="-160"/>
      <line x1="-40" y1="-200" x2="-40" y2="-160"/>
      <line x1="10" y1="-200" x2="10" y2="-160"/>
      <line x1="60" y1="-200" x2="60" y2="-160"/>
      <line x1="110" y1="-200" x2="110" y2="-160"/>
      <line x1="-140" y1="160" x2="-140" y2="200"/>
      <line x1="-90" y1="160" x2="-90" y2="200"/>
      <line x1="-40" y1="160" x2="-40" y2="200"/>
      <line x1="10" y1="160" x2="10" y2="200"/>
      <line x1="60" y1="160" x2="60" y2="200"/>
      <line x1="110" y1="160" x2="110" y2="200"/>
      <line x1="-200" y1="-140" x2="-160" y2="-140"/>
      <line x1="-200" y1="-90" x2="-160" y2="-90"/>
      <line x1="-200" y1="-40" x2="-160" y2="-40"/>
      <line x1="-200" y1="10" x2="-160" y2="10"/>
      <line x1="-200" y1="60" x2="-160" y2="60"/>
      <line x1="-200" y1="110" x2="-160" y2="110"/>
      <line x1="160" y1="-140" x2="200" y2="-140"/>
      <line x1="160" y1="-90" x2="200" y2="-90"/>
      <line x1="160" y1="-40" x2="200" y2="-40"/>
      <line x1="160" y1="10" x2="200" y2="10"/>
      <line x1="160" y1="60" x2="200" y2="60"/>
      <line x1="160" y1="110" x2="200" y2="110"/>
    </g>
    <!-- chip body -->
    <rect x="-160" y="-160" width="320" height="320" rx="14" stroke-width="6" fill="url(#chipFill)"/>
    <!-- inner die -->
    <rect x="-90" y="-90" width="180" height="180" rx="8" stroke-width="4" stroke-opacity="0.7"/>
    <!-- traces -->
    <g stroke-width="3" stroke-opacity="0.55">
      <path d="M -90 -50 L -50 -50 L -50 -90"/>
      <path d="M -90 0 L -30 0"/>
      <path d="M -90 50 L -50 50 L -50 90"/>
      <path d="M 90 -50 L 50 -50 L 50 -90"/>
      <path d="M 90 0 L 30 0"/>
      <path d="M 90 50 L 50 50 L 50 90"/>
    </g>
    <!-- core dot -->
    <circle r="14" fill="url(#stroke)" stroke="none"/>
    <!-- KRNL label inside die -->
    <text x="0" y="60" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="3">RING 0</text>
  </g>
  <text x="60" y="615" fill="#e9d5ff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.5">ExoWare Kernel Driver</text>
  <text x="60" y="648" fill="#a78bfa" fill-opacity="0.65" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing="2">C++ · WINDOWS KERNEL · WDM</text>
</svg>
